<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI 助手</title>
  <!-- 颜色与基础变量：使用 CSS 变量统一主题色，便于换肤 -->
  <style>
    :root {
      --bg: #f3f4f7;
      --card: #ffffff;
      --text: #1f2329;
      --muted: #6b7280;
      --primary: #3b82f6;
      --primary-soft: #e8f1ff;
      --assistant: #f8fafc;
      --border: #e5e7eb;
      --shadow: 0 14px 40px rgba(15, 23, 42, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      color: var(--text);
      background: radial-gradient(circle at top, #ffffff 0%, var(--bg) 45%);
    }

    /* 整体容器：居中限宽 */
    .page {
      max-width: 920px;
      margin: 28px auto;
      padding: 0 14px;
    }

    /* 聊天面板：圆角 + 阴影卡片 */
    .chat-shell {
      border: 1px solid var(--border);
      border-radius: 22px;
      background: var(--card);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    /* 顶部头部 */
    .header {
      padding: 18px 20px 14px;
      border-bottom: 1px solid var(--border);
      background: linear-gradient(180deg, #ffffff 0%, #fafbfd 100%);
    }

    .title {
      margin: 0;
      font-size: 20px;
      font-weight: 700;
    }

    .subtitle {
      margin-top: 6px;
      color: var(--muted);
      font-size: 13px;
    }

    /* 状态指示徽章：动态显示当前任务状态 */
    .status-pill {
      display: inline-flex;
      margin-top: 10px;
      padding: 5px 10px;
      border-radius: 999px;
      background: #f5f7fb;
      color: #4b5563;
      font-size: 12px;
    }

    /* 消息列表区域：可滚动 */
    .messages {
      padding: 22px 16px;
      min-height: 430px;
      max-height: 62vh;
      overflow-y: auto;
      background:
        linear-gradient(transparent 95%, rgba(0, 0, 0, 0.02) 100%),
        #fcfdff;
    }

    .empty {
      text-align: center;
      color: var(--muted);
      margin-top: 38px;
      font-size: 14px;
    }

    /* 单条消息行 */
    .msg-row {
      display: flex;
      margin-bottom: 14px;
    }

    /* 用户消息靠右，AI 消息靠左 */
    .msg-row.user {
      justify-content: flex-end;
    }

    .msg-row.assistant {
      justify-content: flex-start;
    }

    /* 消息气泡 */
    .bubble {
      max-width: min(680px, 84%);
      border-radius: 16px;
      padding: 12px 14px;
      white-space: pre-wrap;
      line-height: 1.55;
      font-size: 14px;
      border: 1px solid var(--border);
    }

    .msg-row.user .bubble {
      background: var(--primary-soft);
      border-color: #cfe2ff;
    }

    .msg-row.assistant .bubble {
      background: var(--assistant);
    }

    /* 消息底部时间/元信息 */
    .meta {
      margin-top: 5px;
      font-size: 12px;
      color: #8a93a1;
    }

    /* 底部输入区 */
    .composer {
      border-top: 1px solid var(--border);
      padding: 14px;
      background: #ffffff;
    }

    .toolbar {
      display: flex;
      gap: 10px;
      align-items: flex-end;
    }

    .input-wrap {
      flex: 1;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 10px 12px;
      background: #fff;
    }

    .prompt-input {
      width: 100%;
      border: none;
      outline: none;
      resize: none;
      min-height: 44px;
      max-height: 130px;
      font-size: 14px;
      line-height: 1.55;
      font-family: inherit;
    }

    .btn {
      border: 1px solid var(--border);
      background: #fff;
      color: var(--text);
      padding: 10px 14px;
      border-radius: 11px;
      font-size: 14px;
      cursor: pointer;
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-primary {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
    }

    .btn-voice {
      min-width: 96px;
    }

    .hint {
      margin-top: 10px;
      color: var(--muted);
      font-size: 12px;
    }

    /* TTS 音频播放条 */
    .audio-bar {
      margin-top: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: var(--muted);
    }

    .audio-bar audio {
      flex: 1;
    }

    /* "AI 正在输入" 动画指示器 */
    .typing::after {
      content: "● ● ●";
      margin-left: 8px;
      letter-spacing: 2px;
      font-size: 11px;
      color: #94a3b8;
      animation: pulse 1s ease-in-out infinite;
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: 0.3;
      }

      50% {
        opacity: 1;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <section class="chat-shell">
      <header class="header">
        <h1 class="title">AI 助手</h1>
        <div class="subtitle">录音后自动识别，再调用 AI 流式回复</div>
        <div class="status-pill" id="status">状态：未开始</div>
      </header>

      <!-- 消息展示区 -->
      <section class="messages" id="messages">
        <div class="empty" id="emptyTip">点击下方开始录音，体验语音问答。</div>
      </section>

      <!-- 输入与操作栏 -->
      <footer class="composer">
        <div class="toolbar">
          <div class="input-wrap">
            <textarea class="prompt-input" id="promptInput"
              placeholder="输入问题，回车发送（Shift+Enter 换行）；也可以用语音按钮说话"></textarea>
          </div>
          <button class="btn btn-voice" id="recordBtn">语音输入</button>
          <button class="btn btn-primary" id="sendBtn">发送</button>
        </div>
        <div class="hint">
          文字直问：/ai/chat/stream；语音链路：/speech/asr -> /ai/chat/stream；语音合成：/speech/tts/ws
        </div>
        <div class="audio-bar">
          <span>AI 语音播放</span>
          <audio id="ttsAudio" controls preload="none"></audio>
        </div>
      </footer>
    </section>
  </main>

  <script>
    // ============ DOM 引用 ============
    const promptInput = document.getElementById("promptInput");
    const sendBtn = document.getElementById("sendBtn");
    const recordBtn = document.getElementById("recordBtn");
    const statusEl = document.getElementById("status");
    const messagesEl = document.getElementById("messages");
    const emptyTipEl = document.getElementById("emptyTip");
    const ttsAudioEl = document.getElementById("ttsAudio");

    // ============ 全局状态变量 ============
    let mediaRecorder = null;            // 录音器实例（MediaRecorder）
    let chunks = [];                       // 录音数据片段数组
    let activeStream = null;              // 当前 SSE 连接（EventSource）引用，便于关闭
    let activeAssistantContentEl = null;  // 当前 AI 气泡正文 DOM，用于流式追加文本
    let activeAssistantMetaEl = null;    // 当前 AI 气泡元信息 DOM
    let activeRecordStream = null;       // 当前麦克风 MediaStream，便于关闭释放
    let isRecording = false;              // 是否处于录音中
    let ttsWs = null;                     // TTS WebSocket 连接
    let ttsSessionId = null;              // TTS 服务端返回的会话 ID
    let ttsMediaSource = null;            // MediaSource 实例（流式播放 mp3）
    let ttsSourceBuffer = null;           // SourceBuffer（向 MediaSource 追加音频数据）
    let ttsPendingBuffers = [];           // 等待追加的音频分片队列（SourceBuffer busy 时缓存）
    let ttsStreamFinal = false;           // 音频流是否结束（用于 endOfStream 收尾）
    let ttsObjectUrl = null;              // blob:URL，便于结束时 revoke

    /**
     * 更新顶部状态徽章文本，可选附加 "正在输入" 动画
     */
    function setStatus(text, isTyping = false) {
      statusEl.textContent = "状态：" + text;
      statusEl.classList.toggle("typing", isTyping);
    }

    /**
     * 返回当前本地时间字符串，用于消息元信息展示
     */
    function nowTime() {
      return new Date().toLocaleTimeString("zh-CN", { hour12: false });
    }

    /**
     * 滚动消息列表到底部，保证最新内容可见
     */
    function scrollToBottom() {
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    /**
     * 隐藏空状态提示文案（首次有消息后调用）
     */
    function hideEmptyTip() {
      if (emptyTipEl) {
        emptyTipEl.style.display = "none";
      }
    }

    /**
     * 在消息列表追加一条消息，返回内部 DOM 引用便于后续更新
     *  - role: 'user' | 'assistant'
     *  - text: 消息正文
     *  - metaText: 元信息文案（默认显示时间）
     */
    function appendMessage(role, text, metaText) {
      hideEmptyTip();
      const row = document.createElement("div");
      row.className = "msg-row " + role;

      const bubble = document.createElement("div");
      bubble.className = "bubble";

      const content = document.createElement("div");
      content.textContent = text;

      const meta = document.createElement("div");
      meta.className = "meta";
      meta.textContent = metaText || nowTime();

      bubble.appendChild(content);
      bubble.appendChild(meta);
      row.appendChild(bubble);
      messagesEl.appendChild(row);
      scrollToBottom();

      return { row, bubble, content, meta };
    }

    /**
     * 关闭当前 SSE 流（AI 流式回复）并清空引用
     */
    function closeActiveStream() {
      if (activeStream) {
        activeStream.close();
        activeStream = null;
      }
    }

    /**
     * 关闭 TTS WebSocket 并重置播放器
     *  - 清空 sessionId
     *  - 释放 MediaSource 资源
     */
    function closeTtsWs() {
      if (ttsWs) {
        ttsWs.close();
        ttsWs = null;
      }
      ttsSessionId = null;
      resetTtsPlayer();
    }

    /**
     * 重置 TTS 播放器：清队列、释放 blob:URL、移除 audio.src
     *  - 防止上一次会话残留数据混入新一次播放
     *
     * 媒体 API 说明：
     *  - URL.revokeObjectURL(): 释放 blob:URL 占用的内存引用。
     *    createObjectURL 会在内存中保留一份二进制数据直到主动 revoke，
     *    不调用会持续占用内存直到页面卸载。
     *  - audio.removeAttribute("src"): 清空音频源，配合 load() 重置元素。
     *  - audio.load(): 强制重新加载（这里用于清空内部缓冲与播放状态）。
     */
    function resetTtsPlayer() {
      ttsPendingBuffers = [];
      ttsStreamFinal = false;
      ttsSourceBuffer = null;
      ttsMediaSource = null;
      if (ttsObjectUrl) {
        // 释放之前 createObjectURL 生成的 blob:URL，避免内存泄漏
        URL.revokeObjectURL(ttsObjectUrl);
        ttsObjectUrl = null;
      }
      // 暂停当前播放（如有）
      ttsAudioEl.pause();
      // 移除 src 让 <audio> 元素回到未加载状态
      ttsAudioEl.removeAttribute("src");
      // load() 让元素丢弃内部解码缓冲，重新进入空白状态
      ttsAudioEl.load();
    }

    /**
     * 准备 MediaSource 流式播放器
     *
     * MediaSource Extensions (MSE) API 工作原理：
     *  ┌────────────────────────────────────────────────────────────┐
     *  │ 1. new MediaSource()      创建"数据源容器"，此时状态 closed │
     *  │ 2. createObjectURL(ms)     生成 blob:URL（指向该容器）      │
     *  │ 3. audio.src = url          <audio> 元素绑定到此 URL         │
     *  │ 4. 浏览器打开 MediaSource   readyState: closed -> open       │
     *  │ 5. 'sourceopen' 事件触发    此时才能 addSourceBuffer         │
     *  │ 6. addSourceBuffer('audio/mpeg') 创建 SourceBuffer           │
     *  │ 7. appendBuffer(binaryChunk)   追加音频分片（可多次调用）    │
     *  │ 8. endOfStream()            通知播放器：数据已完整           │
     *  └────────────────────────────────────────────────────────────┘
     *
     * 关键 API：
     *  - MediaSource.isTypeSupported(mime): 检测浏览器是否支持某 MIME 的解码
     *    （不是所有浏览器都支持 mp3，比如旧 Safari 可能只支持 audio/aac）
     *  - addSourceBuffer(mime): 在 SourceBuffer 内部初始化指定编码的解码器
     *  - appendBuffer(data): 推入一段二进制音频字节，触发异步解码
     *
     * 若不支持 audio/mpeg 则降级为无音频播放（仅显示文本回复）。
     */
    function prepareStreamingAudio() {
      resetTtsPlayer();
      // 兼容性检测：MediaSource 不存在或不支持 mp3 解码则放弃
      if (!window.MediaSource || !MediaSource.isTypeSupported("audio/mpeg")) {
        return;
      }

      // 创建 MediaSource 实例（此时 readyState='closed'，尚不能 addSourceBuffer）
      ttsMediaSource = new MediaSource();
      // 为 MediaSource 生成 blob:URL，可赋给 <audio>.src 使用
      ttsObjectUrl = URL.createObjectURL(ttsMediaSource);
      ttsAudioEl.src = ttsObjectUrl;

      /**
       * sourceopen 事件：MediaSource 被 <audio> 成功打开时触发
       *  - 这是 addSourceBuffer 的最早可用时机（之前 readyState='closed' 会抛错）
       *  - 触发后 readyState 变为 'open'
       *  - MediaSource 还有 sourceended / sourceclose 两个生命周期事件
       */
      ttsMediaSource.addEventListener("sourceopen", () => {
        if (!ttsMediaSource) return;
        // 创建 SourceBuffer（一个"音频解码队列"），指定解码 mp3 格式
        ttsSourceBuffer = ttsMediaSource.addSourceBuffer("audio/mpeg");
        /**
         * SourceBuffer.mode:
         *  - 'segments': 按媒体时间戳排序（适合乱序到达的切片）
         *  - 'sequence' : 按追加顺序拼接（适合无时间戳的连续流，本项目用此模式）
         */
        ttsSourceBuffer.mode = "sequence";
        /**
         * updateend 事件：上一次 appendBuffer 解码完成时触发
         *  - appendBuffer 是异步操作，期间 SourceBuffer.updating=true
         *  - 完成后才会派发 updateend，此时可继续 append 下一段
         *  - 这是实现"链式冲刷"的关键事件
         */
        ttsSourceBuffer.addEventListener("updateend", flushTtsBufferQueue);
        // 立即尝试冲刷（此时可能队列里已有早到的音频分片）
        flushTtsBufferQueue();
      });
    }

    /**
     * 把队列中的音频分片依次 appendBuffer 到 SourceBuffer
     *
     * 关键约束：SourceBuffer 同一时刻只能处理一次 appendBuffer
     *  - appendBuffer 期间 SourceBuffer.updating === true
     *  - 此时若再次调用 appendBuffer 会抛 InvalidStateError
     *  - 所以必须等 updateend 事件触发后才能 append 下一段
     *
     * 工作流程：
     *  - 队列非空 → 取一段 appendBuffer → 等 updateend → 递归冲刷
     *  - 队列空 + 流结束 → endOfStream() 通知播放器音频已完整
     */
    function flushTtsBufferQueue() {
      if (!ttsSourceBuffer || !ttsMediaSource) return;
      // 上一次 append 还在进行中，跳过本次调用（等 updateend 自动触发下一轮）
      if (ttsSourceBuffer.updating) return;

      if (ttsPendingBuffers.length > 0) {
        const next = ttsPendingBuffers.shift();
        if (next) {
          // 追加二进制音频分片，触发异步解码（updating=true → 完成后触发 updateend）
          ttsSourceBuffer.appendBuffer(next);
          // 触发自动播放：
          //  - 浏览器要求"用户交互后"才能自动播放音频，否则 play() 会 reject
          //  - 因此 catch 静默处理（用户已点击发送按钮，通常满足交互条件）
          ttsAudioEl.play().catch(() => {
            // 静默处理自动播放限制
          });
        }
        return;
      }

      // 队列空 + 流已结束：通知 MediaSource 数据已完整，触发 sourceended 事件
      // 注意：必须在 readyState='open' 时调用，否则会抛错
      if (ttsStreamFinal && ttsMediaSource.readyState === "open") {
        try {
          ttsMediaSource.endOfStream();
        } catch {
          // ignore
        }
      }
    }

    /**
     * 切换录音按钮的 UI 状态（文本 + 主色样式）
     */
    function setRecordingUI(recording) {
      isRecording = recording;
      recordBtn.textContent = recording ? "停止录音" : "语音输入";
      recordBtn.classList.toggle("btn-primary", recording);
    }

    /**
     * 上传录音 blob 到 /speech/asr 进行语音识别
     * 返回识别后的文本
     */
    async function uploadAndRecognize(blob) {
      const formData = new FormData();
      formData.append("audio", blob, "record.ogg");

      const response = await fetch("/speech/asr", {
        method: "POST",
        body: formData,
      });
      if (!response.ok) {
        const text = await response.text();
        throw new Error(text || "ASR 请求失败");
      }
      const data = await response.json();
      return data.text || "";
    }

    /**
     * 建立/复用 TTS WebSocket 连接
     *  - 已有可用连接且 sessionId 就绪：直接 resolve
     *  - 否则：连接 /speech/tts/ws，等待服务端回 { type: 'session', sessionId }
     *  - 后续服务端推送的文本/二进制消息由 onmessage 统一处理
     * 返回 Promise<void>，resolve 时表示 sessionId 已就绪
     */
    function ensureTtsConnection() {
      return new Promise((resolve) => {
        // 复用现有连接
        if (ttsWs && ttsWs.readyState === WebSocket.OPEN && ttsSessionId) {
          resolve();
          return;
        }

        // 根据当前页面协议选择 ws/wss
        const protocol = window.location.protocol === "https:" ? "wss" : "ws";
        const wsUrl = `${protocol}://${window.location.host}/speech/tts/ws`;
        const ws = new WebSocket(wsUrl);
        ws.binaryType = "arraybuffer"; // 接收二进制音频分片
        ttsWs = ws;

        ws.onopen = () => {
          // 等待 sessionId 消息
        };

        /**
         * 服务端消息处理：
         *  - 文本帧：JSON 控制信令
         *    · session      : 服务端分配 sessionId
         *    · tts_started  : AI 已开始流式输出，准备播放器
         *    · tts_final    : 合成完成，标记流结束并冲刷队列
         *    · tts_closed   : 连接关闭，同上处理
         *    · tts_error    : 错误，标记流结束
         *  - 二进制帧：音频分片，入队并冲刷
         */
        ws.onmessage = (event) => {
          if (typeof event.data === "string") {
            try {
              const msg = JSON.parse(event.data);
              if (msg.type === "session" && msg.sessionId) {
                ttsSessionId = msg.sessionId;
                resolve();
              } else if (msg.type === "tts_started") {
                prepareStreamingAudio();
              } else if (msg.type === "tts_final" || msg.type === "tts_closed") {
                ttsStreamFinal = true;
                flushTtsBufferQueue();
              } else if (msg.type === "tts_error") {
                ttsStreamFinal = true;
                flushTtsBufferQueue();
              }
            } catch {
              // ignore
            }
          } else if (event.data instanceof ArrayBuffer) {
            ttsPendingBuffers.push(event.data);
            flushTtsBufferQueue();
          }
        };

        // 连接异常：清理后 resolve，让上层逻辑继续（不会阻塞 SSE）
        ws.onerror = () => {
          closeTtsWs();
          resolve();
        };

        ws.onclose = () => {
          ttsWs = null;
        };
      });
    }

    /**
     * 通过 SSE (EventSource) 拉取 AI 流式回复
     *  - 在 AI 气泡中实时累加文本
     *  - 把 ttsSessionId 作为 query 参数传给后端，便于后端触发 TTS 流
     *  - SSE 结束（onerror）时 resolve 最终文本
     */
    function streamAiReply(query) {
      return new Promise((resolve) => {
        closeActiveStream();

        const aiMsg = appendMessage("assistant", "", "AI 正在回答...");
        activeAssistantContentEl = aiMsg.content;
        activeAssistantMetaEl = aiMsg.meta;

        // 注意：EventSource 只支持 GET，所以 query 走 URL 参数
        const url =
          "/ai/chat/stream?query=" +
          encodeURIComponent(query) +
          (ttsSessionId ? "&ttsSessionId=" + encodeURIComponent(ttsSessionId) : "");
        const es = new EventSource(url);
        let aiResult = "";
        activeStream = es;

        // 服务端每次推送一个 chunk（SSE data 字段），累加到 UI
        es.onmessage = (event) => {
          aiResult += event.data || "";
          activeAssistantContentEl.textContent = aiResult || "（空结果）";
          scrollToBottom();
        };

        // SSE 连接结束（服务端 close 或网络中断）都会触发 onerror
        es.onerror = () => {
          es.close();
          if (activeStream === es) {
            activeStream = null;
          }
          if (activeAssistantMetaEl) {
            activeAssistantMetaEl.textContent = "AI 回复完成 " + nowTime();
          }
          resolve(aiResult);
        };
      });
    }

    /**
     * 统一的提问入口：文字/语音最终都走这里
     *  - source: 用于标记消息来源（"文字提问" / "语音提问"）
     *  - 顺序：先确保 TTS WS 就绪 -> 再发起 SSE 拉取 AI 流
     */
    async function askWithQuery(query, source) {
      const trimmed = query.trim();
      if (!trimmed) {
        setStatus("请输入问题");
        return;
      }

      appendMessage("user", trimmed, source + " " + nowTime());
      promptInput.value = "";
      sendBtn.disabled = true;
      setStatus("AI 正在流式回答...", true);

      try {
        await ensureTtsConnection();
        await streamAiReply(trimmed);
        setStatus("对话完成");
      } catch (error) {
        appendMessage(
          "assistant",
          "处理失败：" + (error.message || String(error)),
          "异常 " + nowTime(),
        );
        setStatus("处理失败");
      } finally {
        sendBtn.disabled = false;
      }
    }

    // ============ 事件绑定 ============

    // 发送按钮：直接提交输入框内容
    sendBtn.addEventListener("click", async () => {
      await askWithQuery(promptInput.value, "文字提问");
    });

    // 输入框：Enter 发送，Shift+Enter 换行
    promptInput.addEventListener("keydown", async (event) => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        await askWithQuery(promptInput.value, "文字提问");
      }
    });

    /**
     * 录音按钮：点击切换 录音/停止
     *
     * 录音链路涉及的媒体 API：
     *  - navigator.mediaDevices.getUserMedia(): 申请麦克风访问权限
     *    返回 MediaStream（包含一个或多个 MediaStreamTrack，如 audio track）
     *  - MediaRecorder: 把 MediaStream 实时编码为二进制音频片段
     *    构造参数指定 mimeType（编码格式）与音频来源
     *  - MediaRecorder.isTypeSupported(mime): 检测浏览器是否支持某编码
     *    （不同浏览器支持的编码不同，需降级处理）
     *  - MediaStreamTrack.stop(): 释放设备（关闭麦克风硬件）
     *    不调用会导致浏览器麦克风指示灯常亮、权限状态不释放
     *
     * 事件流：
     *  - dataavailable : 录音过程中周期性触发，把音频片段交给应用层
     *  - stop          : 调用 mediaRecorder.stop() 后触发，表示编码结束
     */
    recordBtn.addEventListener("click", async () => {
      // 录音中：再次点击则停止
      if (isRecording) {
        if (mediaRecorder) {
          // 停止编码：会触发 onstop，在那里收集 chunks 上传识别
          mediaRecorder.stop();
          setStatus("已停止录音，正在识别...");
        }
        return;
      }

      try {
        closeActiveStream();
        // 语音通道与文字通道解耦，不关闭 TTS WS，方便连续对话复用 session
        /**
         * getUserMedia({ audio: true }):
         *  - 弹窗请求麦克风权限，用户允许后返回 MediaStream
         *  - 若用户拒绝/无设备会 reject（进入 catch 分支）
         *  - 返回的 stream 必须在结束时通过 getTracks().stop() 释放
         */
        activeRecordStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        chunks = [];
        /**
         * 编码格式选择：
         *  - ogg/opus: Chrome/Firefox 支持，压缩率高，体积小
         *  - 不支持时退回浏览器默认（Safari 通常是 audio/mp4）
         *  - ASR 后端需能识别多种编码，否则需要后端转码
         */
        const preferredMimeType = "audio/ogg;codecs=opus";
        // isTypeSupported 检测编码是否可用，决定是否传 mimeType
        mediaRecorder = MediaRecorder.isTypeSupported(preferredMimeType)
          ? new MediaRecorder(activeRecordStream, { mimeType: preferredMimeType })
          : new MediaRecorder(activeRecordStream);

        /**
         * dataavailable 事件：录音数据片段就绪时触发
         *  - event.data 是 Blob，包含一段时间内的编码音频
         *  - 触发频率取决于 start(timeslice) 的参数
         *  - 这里把分片依次入队，onstop 时再合并
         */
        mediaRecorder.ondataavailable = (event) => {
          if (event.data && event.data.size > 0) {
            chunks.push(event.data);
          }
        };

        // 录音停止：合并 blob -> 上传 ASR -> 识别结果填入输入框 -> 提交 AI
        mediaRecorder.onstop = async () => {
          try {
            /**
             * Blob 合并：把录音过程中积累的多个 Blob 合并成单个 Blob
             *  - type 指定 MIME 类型，便于后端识别与解析
             *  - 空 Blob 会导致后端无法解析，提前校验
             */
            const blob = new Blob(chunks, {
              type: mediaRecorder.mimeType || "audio/webm",
            });
            if (!blob.size) {
              throw new Error("录音数据为空，请至少录制 1 秒再上传");
            }

            setStatus("语音识别中...");
            const recognized = (await uploadAndRecognize(blob)).trim();
            promptInput.value = recognized;

            if (!recognized) {
              setStatus("识别为空，请重新录音");
              return;
            }

            await askWithQuery(recognized, "语音提问");
          } catch (error) {
            appendMessage(
              "assistant",
              "语音处理失败：" + (error.message || String(error)),
              "异常 " + nowTime(),
            );
            setStatus("语音处理失败");
          } finally {
            /**
             * 释放麦克风硬件：
             *  - MediaStream 包含一个或多个 MediaStreamTrack（如 audio track）
             *  - 每个轨道调用 stop() 才会真正关闭设备
             *  - 不调用：浏览器麦克风指示灯常亮，权限状态不释放
             *  - 释放后再次 getUserMedia 会重新申请权限
             */
            if (activeRecordStream) {
              activeRecordStream.getTracks().forEach((t) => t.stop());
              activeRecordStream = null;
            }
            setRecordingUI(false);
          }
        };

        /**
         * start(250): 启动录音，每 250ms 触发一次 dataavailable
         *  - 参数是分片时间间隔（毫秒）
         *  - 不传则只在 stop 时一次性返回全部数据
         *  - 分片录音可避免内存堆积，也方便实时预览（如显示音量）
         */
        mediaRecorder.start(250);
        setRecordingUI(true);
        setStatus("录音中，点击“停止录音”完成提问");
      } catch (error) {
        appendMessage(
          "assistant",
          "无法开始录音：" + (error.message || String(error)),
          "异常 " + nowTime(),
        );
        setStatus("无法开始录音");
        setRecordingUI(false);
      }
    });
  </script>
</body>

</html>
